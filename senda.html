!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENDA - Turnos PSG</title>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:0 auto;padding:16px;background:#f6f7f8}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;margin:6px 0;cursor:pointer}
.btn-primary{background:#111;color:white}
.btn-sec{background:#e9ecef}
.btn-outline{border:2px solid #111;background:white}
.slot{padding:10px;border:1px solid #ddd;border-radius:10px;margin:6px 0;cursor:pointer}
.slot.sel{background:#111;color:white}
.small{font-size:12px;color:#666}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;margin:6px 0;box-sizing:border-box}
</style>
</head>
<body>
<h2>SENDA La Plata - Turnos</h2>

<div id="paso1" class="card">
  <b>1. ¿Qué estudio?</b>
  <button class="btn btn-primary" onclick="setTipo('DIU_NOC')">PSG Diurno/Nocturno</button>
  <div class="small">Lun, Mar, Jue - 21hs / 23hs / 01hs / 03hs</div>
  <button class="btn btn-primary" style="margin-top:12px" onclick="setTipo('RESP')">PSG Respiratoria</button>
  <div class="small">Lun, Mar, Vie 23hs + Dom 23hs</div>
  <button class="btn btn-outline" style="margin-top:12px" onclick="setTipo('DOM')">Domicilio noche - A convenir</button>
  <div id="prox" class="small" style="margin-top:10px;font-weight:700"></div>
</div>

<div id="paso2" class="card" style="display:none">
  <b>2. Fechas disponibles - <span id="tipoLabel"></span></b>
  <div id="slots"></div>
  <button class="btn btn-sec" onclick="volver1()">← Cambiar tipo</button>
</div>

<div id="paso3" class="card" style="display:none">
  <b>3. Reserva rápida</b>
  <div class="small" id="resumenTurno"></div>
  <input id="nombre" placeholder="Apellido y Nombre*">
  <input id="whatsapp" placeholder="WhatsApp*">
  <input id="dni" placeholder="DNI">
  <button class="btn btn-primary" onclick="guardarReserva()">Reservar</button>
</div>

<div id="paso4" class="card" style="display:none">
  <b>4. Ficha completa</b>
  <div class="grid2"><input id="fechanac" placeholder="Fecha nac."><input id="edad" placeholder="Edad"></div>
  <input id="obra" placeholder="Obra social">
  <input id="direccion" placeholder="Dirección"><input id="localidad" placeholder="Localidad">
  <div class="grid2"><input id="peso" placeholder="Peso kg"><input id="talla" placeholder="Talla"></div>
  <input id="medico" placeholder="Médico solicita"><input id="diag" placeholder="Diagnóstico">
  <textarea id="meds" placeholder="Medicación"></textarea>
  <input type="file" id="ordenFoto">
  <button class="btn btn-primary" onclick="finalizarFicha()">Enviar y generar comprobante</button>
</div>

<div id="paso5" class="card" style="display:none">
  <b>✅ Solicitud enviada</b>
  <div id="comprobante"></div>
  <button class="btn btn-primary" onclick="alert('PDF SENDA generado')">Descargar PDF</button>
  <div class="grid2">
    <button class="btn btn-sec" onclick="cambiarTurno()">Cambiar turno</button>
    <button class="btn btn-outline" onclick="suspenderTurno()">Suspender turno</button>
  </div>
</div>

<div id="panelAdmin" class="card" style="border:2px dashed #111">
  <b>PANEL SEBA (orden por fecha de turno)</b>
  <input id="adminNum" placeholder="Nº ATI manual (ej: 1376 o notebook domicilio 210)">
  <select id="adminLugar"><option>SENDA La Plata</option><option>Domicilio</option></select>
  <select id="adminColab"><option>Colabora</option><option>Colabora poco</option><option>No colabora</option></select>
  <select id="adminProto"><option>Protocolo N3</option><option>Halo + parasaj</option><option>Frontales Sabri</option><option>Completo habitual</option><option>Incompleto</option></select>
  <select id="adminInforma"><option>SABRINA</option><option>FITO</option><option>FITO-SABRI</option></select>
  <label><input type="checkbox" id="adminUrg"> Urgente</label>
  <textarea id="adminSensores" placeholder="Sensores"></textarea>
  <button class="btn btn-primary" onclick="alert('Guardado Nº manual')">Guardar</button>
</div>

<script>
let tipo='',turnoSel='';
const horarios={DIU_NOC:{dias:[1,2,4],horas:['21:00','23:00','01:00','03:00']},RESP:{dias:[1,2,5,0],horas:['23:00']}}
function setTipo(t){tipo=t;document.getElementById('paso1').style.display='none';document.getElementById('paso2').style.display='block';document.getElementById('tipoLabel').innerText=t;document.getElementById('slots').innerHTML='';if(t==='DOM'){const d=document.createElement('div');d.className='slot sel';d.innerText='Domicilio - A convenir';d.onclick=()=>elegirSlot(d.innerText);document.getElementById('slots').appendChild(d);elegirSlot('Domicilio - A convenir');return;}const hoy=new Date();let c=0;for(let k=0;k<21&&c<12;k++){const f=new Date();f.setDate(hoy.getDate()+k);if(!horarios[t].dias.includes(f.getDay()))continue;horarios[t].horas.forEach(h=>{const txt=f.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'})+' '+h;const div=document.createElement('div');div.className='slot';div.innerText=txt;div.onclick=(e)=>{document.querySelectorAll('.slot').forEach(s=>s.classList.remove('sel'));e.target.classList.add('sel');elegirSlot(txt)};document.getElementById('slots').appendChild(div);c++})}}
function elegirSlot(txt){turnoSel=txt;document.getElementById('paso2').style.display='none';document.getElementById('paso3').style.display='block';document.getElementById('resumenTurno').innerText=tipo+' - '+txt;}
function volver1(){document.getElementById('paso2').style.display='none';document.getElementById('paso1').style.display='block';}
function guardarReserva(){if(!nombre.value||!whatsapp.value){alert('Falta nombre/WhatsApp');return;}document.getElementById('paso3').style.display='none';document.getElementById('paso4').style.display='block';}
function finalizarFicha(){document.getElementById('paso4').style.display='none';document.getElementById('paso5').style.display='block';comprobante.innerHTML=nombre.value+'<br>'+tipo+' - '+turnoSel;}
function cambiarTurno(){document.getElementById('paso5').style.display='none';document.getElementById('paso2').style.display='block';}
function suspenderTurno(){if(confirm('¿Suspender?'))location.reload();}
</script>
</body>
</html>
