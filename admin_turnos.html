<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Turnos Estudios del Sueño</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",
            authDomain: "family-game-show.firebaseapp.com",
            projectId: "family-game-show",
            storageBucket: "family-game-show.firebasestorage.app",
            messagingSenderId: "509983775898",
            appId: "1:509983775898:web:47695f5b312553d9bd1323",
            measurementId: "G-P941BVG2ST"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', () => {
            escucharSolicitudes();
        });

        function escucharSolicitudes() {
            onSnapshot(collection(db, "solicitudes_turnos"), (snapshot) => {
                const contenedor = document.getElementById('listaTurnos');
                contenedor.innerHTML = "";
                
                if (snapshot.empty) {
                    contenedor.innerHTML = "<p style='color:#94a3b8; text-align:center;'>No hay solicitudes pendientes.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    let t = docSnap.data();
                    let id = docSnap.id;

                    let div = document.createElement('div');
                    div.className = "card-turno";
                    div.innerHTML = `
                        <div style="font-weight:bold; color:var(--gold); font-size:1rem; margin-bottom:4px;">${t.nombre_paciente}</div>
                        <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:8px;">📱 Tel: ${t.telefono}</div>
                        <a href="${t.orden_url}" target="_blank" style="color:var(--cyan); font-size:0.8rem; display:inline-block; margin-bottom:10px;">📄 Ver Orden Médica (Foto)</a>
                        
                        <div style="display:flex; gap:6px; margin-top:8px;">
                            <button class="btn-accion" style="background:#3b82f6;" onclick="asignarEstudio('${id}', '${t.telefono}', '${t.nombre_paciente}', 2)">Estudio 2hs (Neurológico)</button>
                            <button class="btn-accion" style="background:#10b981;" onclick="asignarEstudio('${id}', '${t.telefono}', '${t.nombre_paciente}', 6)">Estudio 6hs (Largo/Apnea)</button>
                        </div>
                    `;
                    contenedor.appendChild(div);
                });
            });
        }

        window.asignarEstudio = function(idTurno, telefono, nombre, duracionHs) {
            let fechaElegida = prompt(`Asignar estudio de ${duracionHs} horas a ${nombre}.\nIngresá la fecha sugerida (Ej: Lunes 15/06 - 21:00 hs):`);
            if (!fechaElegida) return;

            let mensajeWsp = `Hola ${nombre}! Te escribimos de Estudios del Sueño. Ya procesamos tu orden médica. Te asignamos tu turno para el *${fechaElegida}* (Duración aprox: ${duracionHs} horas). Por favor confirmanos si te queda bien.`;
            let linkWsp = `https://wa.me/549${telefono}?text=${encodeURIComponent(mensajeWsp)}`;

            // Abrir WhatsApp para mandarle el mensaje al paciente al toque
            window.open(linkWsp, '_blank');

            // Opcional: Borrar de pendientes o marcar como asignado
            deleteDoc(doc(db, "solicitudes_turnos", idTurno));
        };
    </script>
    <style>
        :root { --dark: #0f172a; --card: #1e293b; --cyan: #00f5d4; --gold: #ffd166; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background: var(--dark); color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.4rem; color: var(--cyan); text-align: center; text-transform: uppercase; margin-bottom: 20px; }
        .card-turno { background: var(--card); border: 1px solid #334155; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
        .btn-accion { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; font-size: 0.75rem; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Panel de Solicitudes de Turno</h1>
        <div id="listaTurnos"></div>
    </div>
</body>
</html>
